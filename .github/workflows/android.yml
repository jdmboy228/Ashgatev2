# Builds the Android app (android/) and runs its tests. The Android SDK, NDK
# and Gradle exist only here, never on the development server.
#
# Run it by hand (workflow_dispatch). GitHub only offers that for a workflow
# on the default branch, so until this file is merged the branch's own pushes
# build too; drop the push trigger at merge.
name: android

on:
  workflow_dispatch:
  push:
    branches: [android-mvp]
    paths:
      - "android/**"
      - "ashgate-src/mobile/**"
      - "ashgate-src/internal/mobilecfg/**"
      - "ashgate-src/internal/vless/**"
      - "ashgate-src/internal/subs/**"
      - "ashgate-src/go.mod"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ashgate-src/go.mod
          cache-dependency-path: ashgate-src/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Xray's geosite:category-ru comes from this file; it ships inside
      # the APK. Pinned release, checked by hash.
      - name: Geodata
        working-directory: android/app/src/main
        run: |
          mkdir -p assets && cd assets
          curl -fsSL --retry 3 -o geosite.dat https://github.com/v2fly/domain-list-community/releases/download/20261110034535/dlc.dat
          sha256sum -c <<'SUMS'
          6cc4decf520dbfd96e1e3750661976eb31d2a5381090b8768cb2ab1528201fcf  geosite.dat
          SUMS
          # Only geosite:category-ru stays (about 25 MB less);
          # the router tests below run on the trimmed file.
          (cd "$GITHUB_WORKSPACE/ashgate-src" && go run ./cmd/geotrim "$GITHUB_WORKSPACE/android/app/src/main/assets")

      # Links, subscriptions and proxies; the Xray document; and the real
      # Xray router with the geodata above (mobile/router_test.go).
      - name: Tests
        working-directory: ashgate-src
        env:
          ASHGATE_GEODATA: ${{ github.workspace }}/android/app/src/main/assets
        run: |
          go test ./internal/mobilecfg/ ./internal/subs/ ./cmd/geotrim/
          go test -v ./mobile/
          go test ./internal/vless/ -run 'Parse|ClientJSON|Outbound|TLSPinned|Fingerprint|Normalize|UnknownType'

      - name: Go core (AAR)
        working-directory: ashgate-src
        run: |
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          # -checklinkname=0: Xray's dependency anet reaches into package net
          # on Android, which the linker refuses since Go 1.23.
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          mkdir -p ../android/app/libs
          # amd64 only feeds the emulator APK below; the release packs arm64.
          gomobile bind -target=android/arm64,android/amd64 -androidapi 24 -javapkg io.ashgate \
            -trimpath -ldflags "-s -w -checklinkname=0" -o ../android/app/libs/ashgate.aar ./mobile

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # The same key for every build (secrets ANDROID_KEYSTORE_BASE64 and
      # ANDROID_KEYSTORE_PASSWORD), so an update installs over the old app
      # and keeps its profiles.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::secret ANDROID_KEYSTORE_BASE64 is not set"; exit 1; fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/ashgate.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/ashgate.p12" >> "$GITHUB_ENV"

      - name: APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        # JVM unit tests (app/src/test) first, then the signed APK (arm64).
        # Then the same release build with the x86_64 core for the emulator:
        # translated ARM Go code dies there on a CPU-ID instruction that
        # real phones handle.
        run: |
          gradle --no-daemon testReleaseUnitTest assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/app-release.apk
          gradle --no-daemon assembleRelease -Pashgate.abis=x86_64
          cp app/build/outputs/apk/release/app-release.apk dist/app-smoke-x86_64.apk

      # The certificate's SHA-256 is public; a different one means a different key.
      - name: Signature
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs android/dist/app-release.apk | tee certs.txt
          grep -q "SHA-256 digest: 0a030808a89c00f3db1f73400deae24cb493b6bf9e1c12734f2aec96f24b1ebf" certs.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ashgate-android-apk
          path: android/dist/app-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ashgate-android-smoke-apk
          path: android/dist/app-smoke-x86_64.apk
          if-no-files-found: error

  # Installs the APK on an emulator and goes through it like a user: adds a
  # (fake) profile, picks an app, connects, checks the VPN interface is up,
  # disconnects, then taps around at random. Any crash or ANR fails the run.
  # It runs the x86_64 build of the same release (same code, R8 and
  # geodata; only the Go core's CPU differs).
  smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ashgate-android-smoke-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash android/ci/smoke.sh apk/app-smoke-x86_64.apk smoke-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke-out
          if-no-files-found: ignore
