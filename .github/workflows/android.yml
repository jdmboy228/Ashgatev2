# Builds the Android app (android/) and runs its tests. The Android SDK, NDK
# and Gradle exist only here, never on the development server.
#
# Run it by hand (workflow_dispatch). GitHub only offers that for a workflow
# on the default branch, so until this file is merged the branch's own pushes
# build too; drop the push trigger at merge.
name: android

on:
  workflow_dispatch:
  push:
    branches: [android-mvp]
    paths:
      - "android/**"
      - "ashgate-src/mobile/**"
      - "ashgate-src/internal/mobilecfg/**"
      - "ashgate-src/internal/vless/**"
      - "ashgate-src/internal/subs/**"
      - "ashgate-src/internal/config/**"
      - "ashgate-src/internal/secret/**"
      - "ashgate-src/internal/bootstrap/**"
      - "ashgate-src/internal/atomicfile/**"
      - "ashgate-src/cmd/geotrim/**"
      - "ashgate-src/go.mod"
      - "ashgate-src/go.sum"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ashgate-src/go.mod
          cache-dependency-path: ashgate-src/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Xray's geosite:category-ru comes from this file; it ships inside
      # the APK. Pinned release, checked by hash.
      - name: Geodata
        working-directory: android/app/src/main
        run: |
          mkdir -p assets && cd assets
          curl -fsSL --retry 3 -o geosite.dat https://github.com/v2fly/domain-list-community/releases/download/20261110034535/dlc.dat
          sha256sum -c <<'SUMS'
          6cc4decf520dbfd96e1e3750661976eb31d2a5381090b8768cb2ab1528201fcf  geosite.dat
          SUMS
          # Only geosite:category-ru stays (about 25 MB less);
          # the router tests below run on the trimmed file.
          (cd "$GITHUB_WORKSPACE/ashgate-src" && go run ./cmd/geotrim "$GITHUB_WORKSPACE/android/app/src/main/assets")

      # Ссылки, подписки, прокси, DoH bootstrap, JSON Xray и реальный роутер на урезанной геодате.
      - name: Tests
        working-directory: ashgate-src
        env:
          ASHGATE_GEODATA: ${{ github.workspace }}/android/app/src/main/assets
        run: |
          go vet ./mobile/ ./internal/mobilecfg/ ./internal/vless/ ./internal/subs/ ./internal/bootstrap/ ./cmd/geotrim/
          go test -race ./internal/mobilecfg/ ./internal/subs/ ./internal/bootstrap/ ./cmd/geotrim/
          go test -v ./mobile/
          go test ./internal/vless/ -run 'Parse|ClientJSON|Outbound|TLSPinned|Fingerprint|Normalize|UnknownType|TestExplain|TestRunTrackerClosesLiveSockets|TestLogHookMarksTunDead|TestVerifyAndCheckXHTTPReality'

      - name: Go core (AAR)
        working-directory: ashgate-src
        env:
          ANDROID_NDK_VERSION: "27.2.12479018"
        run: |
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          if [ ! -d "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" ]; then
            (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ANDROID_NDK_VERSION"
          fi
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          mkdir -p ../android/app/libs
          # -checklinkname=0: зависимость anet обращается к пакету net на Android (Go 1.23+).
          # -Wl,-z,max-page-size=16384: выравнивание LOAD-сегментов под устройства с 16 KB страницами.
          gomobile bind -target=android/arm64,android/amd64 -androidapi 24 -javapkg io.ashgate \
            -trimpath -ldflags "-s -w -checklinkname=0 -extldflags=-Wl,-z,max-page-size=16384" \
            -o ../android/app/libs/ashgate.aar ./mobile
          # Проверяем выравнивание >= 16 KB (кратно 0x4000) для всех LOAD-сегментов arm64-v8a libgojni.so.
          unzip -p ../android/app/libs/ashgate.aar jni/arm64-v8a/libgojni.so > "$RUNNER_TEMP/libgojni.so"
          readelf -lW "$RUNNER_TEMP/libgojni.so" | grep 'LOAD' | tee "$RUNNER_TEMP/load.txt"
          python3 -c '
          import sys
          lines = [l.strip() for l in open(sys.argv[1]) if l.strip().startswith("LOAD")]
          assert lines, "No LOAD segments found"
          for l in lines:
              align = int(l.split()[-1], 16)
              if align < 16384 or align % 16384 != 0:
                  sys.exit(f"Bad ELF LOAD alignment ({hex(align)}): {l}")
          ' "$RUNNER_TEMP/load.txt"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # The same key for every build (secrets ANDROID_KEYSTORE_BASE64 and
      # ANDROID_KEYSTORE_PASSWORD), so an update installs over the old app
      # and keeps its profiles.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::secret ANDROID_KEYSTORE_BASE64 is not set"; exit 1; fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/ashgate.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/ashgate.p12" >> "$GITHUB_ENV"

      - name: APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_NDK_VERSION: "27.2.12479018"
          ASHGATE_VERSION_CODE: ${{ github.run_number }}
        # Сначала JVM-тесты и lintRelease, затем релизный arm64 APK, затем clean и x86_64 APK для эмулятора.
        run: |
          gradle --no-daemon testReleaseUnitTest lintRelease assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/app-release.apk
          # Убеждаемся, что релизный APK содержит только arm64-v8a libgojni.so.
          unzip -l dist/app-release.apk | grep -q 'lib/arm64-v8a/libgojni.so'
          if unzip -l dist/app-release.apk | grep -E 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "::error::unexpected ABI found in arm64 release APK"; exit 1
          fi
          gradle --no-daemon clean assembleRelease -Pashgate.abis=x86_64
          cp app/build/outputs/apk/release/app-release.apk dist/app-smoke-x86_64.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-release.*
          if-no-files-found: ignore

      # The certificate's SHA-256 is public; a different one means a different key.
      - name: Signature
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs android/dist/app-release.apk | tee certs.txt
          grep -q "SHA-256 digest: 0a030808a89c00f3db1f73400deae24cb493b6bf9e1c12734f2aec96f24b1ebf" certs.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ashgate-android-apk
          path: android/dist/app-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ashgate-android-smoke-apk
          path: android/dist/app-smoke-x86_64.apk
          if-no-files-found: error

  # Installs the APK on an emulator and goes through it like a user: adds a
  # (fake) profile, picks an app, connects, checks the VPN interface is up,
  # disconnects, then taps around at random. Any crash or ANR fails the run.
  # It runs the x86_64 build of the same release (same code, R8 and
  # geodata; only the Go core's CPU differs).
  smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ashgate-android-smoke-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash android/ci/smoke.sh apk/app-smoke-x86_64.apk smoke-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots-api-${{ matrix.api-level }}
          path: smoke-out
          if-no-files-found: ignore
